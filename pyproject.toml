[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdxproto"
version = "1.1.0"
description = "Pure-Python binary protocol library for TDX (Tongdaxin) stock & futures market data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tdxproto contributors" }]
keywords = ["tdx", "tongdaxin", "stock", "futures", "a-share", "protocol", "binary"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/IdiotYnm/tdxproto"

[tool.setuptools.packages.find]
include = ["tdxproto*"]
